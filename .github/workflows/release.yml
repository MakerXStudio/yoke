name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify -- --no-tests --verbose

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/tags-before"
          npx --yes semantic-release@25.0.9

      - name: Find new tag
        id: release
        run: echo "tag=$(git tag --list 'v*' | grep -vxFf "$RUNNER_TEMP/tags-before" | head -n1 || true)" >> "$GITHUB_OUTPUT"

      - name: Get release app token
        if: steps.release.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Lock released yoke for CI review
        if: steps.release.outputs.tag != ''
        working-directory: ci/review-tools
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version=${TAG#v}
          for _ in $(seq 1 30); do
            [ "$(npm view "@makerx/yoke@$version" version 2>/dev/null)" = "$version" ] && break
            sleep 10
          done
          npm install --package-lock-only --save-exact "@makerx/yoke@$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: lock yoke $version for the CI review" -- package.json package-lock.json
          git tag "review-$TAG"
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}" "refs/tags/review-$TAG"
          git pull --rebase --autostash origin main
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main

      - name: Summary
        env:
          tag: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$tag" ]; then
            echo "No new version was released (latest tag: $(git describe --tags --abbrev=0 2>/dev/null || echo 'none')). See the Release step log for the reason." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Released ${tag}"
            echo
            echo "- npm: https://www.npmjs.com/package/@makerx/yoke/v/${tag#v}"
            echo "- GitHub: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${tag}"
          } >> "$GITHUB_STEP_SUMMARY"
