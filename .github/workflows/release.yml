name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify -- --no-tests --verbose

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/tags-before"
          npx --yes semantic-release@25.0.9

      - name: Summary
        run: |
          tag=$(git tag --list 'v*' | grep -vxFf "$RUNNER_TEMP/tags-before" | head -n1 || true)
          if [ -z "$tag" ]; then
            echo "No new version was released (latest tag: $(git describe --tags --abbrev=0 2>/dev/null || echo 'none')). See the Release step log for the reason." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Released ${tag}"
            echo
            echo "- npm: https://www.npmjs.com/package/@makerx/yoke/v/${tag#v}"
            echo "- GitHub: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${tag}"
          } >> "$GITHUB_STEP_SUMMARY"
