name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js sync
      - name: Fail if the committed skills are not the output of yoke sync
        run: |
          if [ -n "$(git status --porcelain .claude/skills)" ]; then
            git status --porcelain .claude/skills
            git diff .claude/skills
            echo "::error::.claude/skills is out of date. Run yoke sync and commit the result."
            exit 1
          fi

  ci:
    uses: makerxstudio/shared-config/.github/workflows/node-ci.yml@28ab4b75c385b9b0880e5736ca8114caaf688ab8
    with:
      node-version: 24.x
      run-build: true
      build-script: npm run build
      lint-script: npm run verify -- --no-tests --verbose
      test-script: npm run test:ci
      output-test-results: true
