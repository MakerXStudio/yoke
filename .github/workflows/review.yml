name: Review

on:
  workflow_call:
    inputs:
      provider:
        description: litellm or foundry
        type: string
        default: litellm
      reviewer1-harness:
        description: claude or codex
        type: string
        default: claude
      reviewer1-model:
        description: Model reviewer 1 runs; see `yoke models`
        type: string
        required: true
      reviewer2-harness:
        description: claude or codex
        type: string
        default: codex
      reviewer2-model:
        description: Model reviewer 2 runs; see `yoke models`
        type: string
        required: true
      synthesis-harness:
        description: 'claude or codex. Default: reviewer1-harness'
        type: string
        default: ''
      synthesis-model:
        description: 'Model the synthesis runs. Default: reviewer1-model'
        type: string
        default: ''
      azure-client-id:
        description: Entra app (client) ID to reach Foundry with a GitHub OIDC token instead of REVIEW_CI_API_KEY. The caller must grant id-token write
        type: string
        default: ''
      azure-tenant-id:
        description: Entra tenant ID of azure-client-id
        type: string
        default: ''
      environment:
        description: GitHub environment the review job runs in, so its OIDC subject matches the app's federated credential
        type: string
        default: ''
      base-url:
        description: LiteLLM proxy URL, or https://<resource>.services.ai.azure.com for Foundry; typically vars.REVIEW_CI_BASE_URL
        type: string
        default: ''
    secrets:
      REVIEW_CI_BASE_URL:
        description: 'Deprecated: pass the base-url input instead'
        required: false
      REVIEW_CI_API_KEY:
        description: LiteLLM or Foundry API key
        required: false

jobs:
  push:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review: ${{ steps.decide.outputs.review }}
    steps:
      - name: Check out yoke's locked review tools
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke
          sparse-checkout: ci/review-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install yoke from the lockfile, skipping the reviewers' platform binaries
        working-directory: yoke/ci/review-tools
        run: |
          npm ci --omit=optional
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check out yoke's own PR source, so its workflow runs the commands it adds
        if: github.repository == 'MakerXStudio/yoke' && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke-source
          persist-credentials: false

      - name: Build that yoke and put it ahead of the locked yoke on PATH
        if: github.repository == 'MakerXStudio/yoke' && github.event_name == 'pull_request'
        working-directory: yoke-source
        run: |
          npm ci && npm run build
          mkdir bin && ln -s "$PWD/dist/cli.js" bin/yoke && echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Run the review on this push only if no earlier run has started one for the PR
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: yoke review-push

  review:
    needs: push
    if: >-
      !cancelled() && github.event.pull_request.user.type != 'Bot' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
          (github.event.action != 'synchronize' || needs.push.outputs.review == 'true')) ||
        (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'review' && github.event.pull_request.head.repo.full_name != github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check out yoke's locked review tools
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke
          sparse-checkout: ci/review-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install yoke, Claude Code and Codex from the lockfile
        working-directory: yoke/ci/review-tools
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check out yoke's own PR source, so its workflow runs the commands it adds
        if: github.repository == 'MakerXStudio/yoke' && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke-source
          persist-credentials: false

      - name: Build that yoke and put it ahead of the locked yoke on PATH
        if: github.repository == 'MakerXStudio/yoke' && github.event_name == 'pull_request'
        working-directory: yoke-source
        run: |
          npm ci && npm run build
          mkdir bin && ln -s "$PWD/dist/cli.js" bin/yoke && echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Mark the approved review as running, unless the label came from a user without write access
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: yoke review-gate pending

      - name: Allow unprivileged user namespaces for the Codex sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Review PR
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPROVED_HEAD: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          YOKE_LITELLM_BASE_URL: ${{ inputs.provider == 'litellm' && (inputs.base-url || secrets.REVIEW_CI_BASE_URL) || '' }}
          YOKE_LITELLM_API_KEY: ${{ inputs.provider == 'litellm' && secrets.REVIEW_CI_API_KEY || '' }}
          YOKE_FOUNDRY_BASE_URL: ${{ inputs.provider == 'foundry' && (inputs.base-url || secrets.REVIEW_CI_BASE_URL) || '' }}
          YOKE_FOUNDRY_API_KEY: ${{ inputs.provider == 'foundry' && inputs.azure-client-id == '' && secrets.REVIEW_CI_API_KEY || '' }}
          YOKE_FOUNDRY_AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
          YOKE_FOUNDRY_AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
          YOKE_REVIEW_REVIEWER_1_HARNESS: ${{ inputs.reviewer1-harness }}
          YOKE_REVIEW_REVIEWER_1_PROVIDER: ${{ inputs.provider }}
          YOKE_REVIEW_REVIEWER_1_MODEL: ${{ inputs.reviewer1-model }}
          YOKE_REVIEW_REVIEWER_2_HARNESS: ${{ inputs.reviewer2-harness }}
          YOKE_REVIEW_REVIEWER_2_PROVIDER: ${{ inputs.provider }}
          YOKE_REVIEW_REVIEWER_2_MODEL: ${{ inputs.reviewer2-model }}
          YOKE_REVIEW_SYNTHESIS_HARNESS: ${{ inputs.synthesis-harness || inputs.reviewer1-harness }}
          YOKE_REVIEW_SYNTHESIS_PROVIDER: ${{ inputs.provider }}
          YOKE_REVIEW_SYNTHESIS_MODEL: ${{ inputs.synthesis-model || (!inputs.synthesis-harness && inputs.reviewer1-model) || '' }}
        run: |
          gh auth setup-git
          yoke review "$PR_NUMBER" --post --verbose ${APPROVED_HEAD:+--head "$APPROVED_HEAD"}

  gate:
    needs: review
    if: always() && (github.event_name == 'pull_request' || needs.review.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out yoke's locked review tools
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke
          sparse-checkout: ci/review-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install yoke from the lockfile, skipping the reviewers' platform binaries
        working-directory: yoke/ci/review-tools
        run: |
          npm ci --omit=optional
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check out yoke's own PR source, so its workflow runs the commands it adds
        if: github.repository == 'MakerXStudio/yoke' && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke-source
          persist-credentials: false

      - name: Build that yoke and put it ahead of the locked yoke on PATH
        if: github.repository == 'MakerXStudio/yoke' && github.event_name == 'pull_request'
        working-directory: yoke-source
        run: |
          npm ci && npm run build
          mkdir bin && ln -s "$PWD/dist/cli.js" bin/yoke && echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Require the latest review, or a fork's approved review, to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: yoke review-gate "$REVIEW_RESULT"

  unapprove:
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out yoke's locked review tools
        uses: actions/checkout@v4
        with:
          repository: MakerXStudio/yoke
          ref: ${{ job.workflow_sha }}
          path: yoke
          sparse-checkout: ci/review-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install yoke from the lockfile, skipping the reviewers' platform binaries
        working-directory: yoke/ci/review-tools
        run: |
          npm ci --omit=optional
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Remove the review label so a maintainer reads the new commits before they are reviewed
        env:
          GH_TOKEN: ${{ github.token }}
        run: yoke review-unapprove
